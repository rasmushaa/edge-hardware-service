[project]
name = "edge-hardware-service"
version = "0.1.1rc1"
description = "Containerized HTTP adapter for Raspberry Pi GPIO hardware"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.142.2",
    "piexif>=1.1.3",
    "uvicorn>=0.54.0",
]

[build-system]
requires = ["uv_build>=0.12.20,<0.13"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "httpx2>=2.13.1",
    "pre-commit>=4.3.0",
    "pytest>=9.1.1",
    "ruff>=0.14.1",
]

[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
ignore = ["UP042"]
select = ["B", "E4", "E7", "E9", "F", "I", "UP"]

[tool.pytest.ini_options]
addopts = "--import-mode=importlib -m 'not rpi'"
testpaths = ["tests"]
markers = [
    "rpi: tests that access Raspberry Pi hardware and require explicit opt-in",
    "camera_rpi: tests that require a Raspberry Pi Camera Module 3",
]
