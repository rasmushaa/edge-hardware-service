name: API documentation

# Repository setting: Pages > Build and deployment > Source must be GitHub Actions.
on:
  push:
    branches: [main]

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: read

    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v8.3.2
        with:
          enable-cache: true

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Install Python dependencies
        run: uv sync --locked --no-dev

      - name: Export OpenAPI schema
        env:
          EDGE_HARDWARE_SERVICE_BACKEND: simulation
        run: uv run --frozen --no-dev python scripts/export_openapi.py

      - name: Build static API documentation
        env:
          REDOCLY_SUPPRESS_UPDATE_NOTICE: "true"
        run: >-
          npx --yes @redocly/cli@2.45.0 build-docs
          build/api-docs/openapi.json
          --output build/api-docs/index.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: build/api-docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
